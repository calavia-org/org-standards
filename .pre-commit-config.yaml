# Pre-commit configuration for calavia-org/org-standards.
#
# This repository dogfoods the canonical config it ships:
#   templates/.pre-commit-config.yaml.template
#
# Install:
#   pre-commit install --install-hooks
#   pre-commit install --hook-type commit-msg
---
repos:
  # --- Universal (required for every repository) -----------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-merge-conflict
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: no-commit-to-branch
        args: ['--branch', 'main', '--branch', 'master', '--branch', '/^release\/.+/']

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - docs
          - style
          - refactor
          - perf
          - test
          - build
          - ci
          - chore
          - revert

  # --- Documentation ----------------------------------------------------------
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
      - id: markdownlint
        args: ['--disable', 'MD013', 'MD033', 'MD041']

  # --- GitHub Actions (no workflows in this repo; hook self-skips) ------------
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # --- Python (no .py files in this repo; hook self-skips) --------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
